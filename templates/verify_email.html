<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Verification</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;

background:linear-gradient(135deg,#0f172a,#1d4ed8,#2563eb);

font-family:'Segoe UI',sans-serif;

}

.verify-box{

width:420px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

padding:40px;

border-radius:20px;

text-align:center;

color:white;

box-shadow:0 20px 40px rgba(0,0,0,.35);

}

.verify-box i{

font-size:65px;

color:#facc15;

margin-bottom:20px;

}

.verify-box h2{

margin-bottom:15px;

}

.verify-box p{

margin-bottom:25px;

color:#dbeafe;

line-height:1.6;

}

.verify-box input{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:10px;

margin-bottom:20px;

font-size:18px;

text-align:center;

letter-spacing:4px;

}

.verify-box button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#facc15;

color:#111827;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.verify-box button:hover{

transform:translateY(-3px);

}

.error{

color:#ff6b6b;

margin-top:15px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="verify-box">

<i class="fa-solid fa-envelope-circle-check"></i>

<h2>Email Verification</h2>

<p>

We have sent a 6-digit OTP to your email.

Please enter it below.

</p>

<form method="POST">

<input
type="text"
name="otp"
placeholder="Enter OTP"
required>

<button type="submit">

Verify Email

</button>

</form>

{% if error %}

<p class="error">{{ error }}</p>

{% endif %}

</div>

</body>

</html>
